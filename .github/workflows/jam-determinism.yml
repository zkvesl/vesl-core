name: JAM Determinism

# Recompiles each kernel from protocol/lib/*.hoon and asserts the resulting
# JAM sha256 matches scripts/CHECKSUMS.sha256 (the maintainer's reference).
#
# RE-ENABLED (2026-07-22) on honk, the native Hoon compiler. The gate was
# disabled 2026-05-25 because CI's hoonc produced different bytes than the
# maintainer's; the root cause turned out to be the compiler baking the
# build machine's absolute entry path into the artifact (both in the entry
# %spot and in the dir-hash target key) — not glibc. honk with cwd-relative
# spot paths produces byte-identical jams from any checkout location
# (verified by cross-directory builds), which is what makes this gate
# meaningful. If CI bytes still diverge on ubuntu-latest, treat that as a
# portability finding to report, not as a kernel-source regression.
#
# ⚑⚑ 2026-09-10: THE FORK IS RETIRED AND THIS FILE'S OWN EXIT CONDITION HAS FIRED.
# The block that stood here said: "When those land upstream, point the checkout back
# at nockchain/nockchain and fold HONK_REV into NOCK_PIN."  They landed — all eight
# nockcloud fixes (PR #146's axis + wide-`=/`, AND the cwd-relative spot paths this
# job's path-independence premise rests on) rode in on nockchain/nockchain PR 153,
# squash f4fe1a8f, 2026-08-30.  · VERIFIED BY SOURCE CONTENT, not by history: a squash
# rewrites every SHA, so `git log fork..upstream` reports dozens of "ours-only"
# commits whether or not a line is missing, and grepping the squash message proves
# nothing because the message LISTS what it squashed.  Record: zkML records/S24.
#
# ⛔⛔ THE KERNEL BYTES MOVE WITH THIS BUMP, AND NOT BECAUSE OF THE COMPILER.
# · MEASURED 2026-09-10, four kernels x two trees x two compilers:
#     tree 26b146fe + fork honk == tree 26b146fe + upstream honk   (byte-identical)
#     tree 2bcb0b9d + fork honk == tree 2bcb0b9d + upstream honk   (byte-identical)
#     but tree 26b146fe != tree 2bcb0b9d
#   ⇒ the COMPILER SWAP IS BYTE-NEUTRAL; what moves the bytes is the hoon TREE, which
#   this job takes from the same checkout (NOCK_HOME below) and which differs by 48
#   files between the fork rev and the upstream pin.
#
# ⇒ scripts/CHECKSUMS.sha256 MUST BE BUMPED, in a dedicated commit, from THIS JOB'S
#   OWN OUTPUT — deliberately not from a local run.  · MEASURED: a local checkout does
#   NOT reproduce the current committed checksums even at the current HONK_REV, so a
#   locally-baked value would be unverifiable.  Read the `actual:` lines from the first
#   red run here and commit those, with a reviewer explanation.
#
# NOCK_PIN still pins the nockchain tree for every other consumer.  It is NOT used by
# this job — the hoon tree comes from the HONK_REV checkout below.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  NOCK_PIN: dfc97ecc877687fc7ca972ebc71877df6e80d92b
  HONK_REV: 2bcb0b9dfd190f17252205afd1c8a067048a1ad9

jobs:
  jam-determinism:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vesl-core
        uses: actions/checkout@v4
        with:
          path: vesl-core

      - name: Checkout nockchain (honk compiler rev)
        uses: actions/checkout@v4
        with:
          repository: nockchain/nockchain
          ref: ${{ env.HONK_REV }}
          path: nockchain

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nockchain

      - name: Cache honk binary
        id: honk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/honk
          key: honk-${{ env.HONK_REV }}

      - name: Install honk (cache miss only)
        if: steps.honk-cache.outputs.cache-hit != 'true'
        working-directory: nockchain
        run: cargo install --locked --force --path crates/honk --bin honk

      - name: Set up hoon symlinks
        working-directory: vesl-core
        env:
          NOCK_HOME: ${{ github.workspace }}/nockchain
        run: ./scripts/setup-hoon-tree.sh

      - name: Run check-jam.sh
        working-directory: vesl-core
        env:
          NOCK_HOME: ${{ github.workspace }}/nockchain
        run: ./scripts/check-jam.sh

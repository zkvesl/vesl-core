name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# AUDIT 2026-05-19 H-22: the test / audit / clippy jobs check out the
# sibling nockchain monorepo at NOCK_PIN so vesl-core's nockchain
# path-deps resolve. NOCK_PIN mirrors jam-determinism.yml and sync.sh —
# scripts/check-pins.sh gates the match.
#
# Same pattern for VESL_WALLET_PIN: vesl-core has path-deps to
# `../../../vesl-wallet/crates/{vesl-signing,vesl-wallet-spec,vesl-wallet}`,
# so CI checks out vesl-wallet as a sibling. Bump this when vesl-wallet
# ships a compatible release.
env:
  NOCK_PIN: dfc97ecc877687fc7ca972ebc71877df6e80d92b
  VESL_WALLET_PIN: 71e1eef93076b2ad0f2ad6320905bc8a306267c2

jobs:
  check-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts/check-pins.sh
        run: ./scripts/check-pins.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vesl-core
        uses: actions/checkout@v4
        with:
          path: vesl-core
      - name: Checkout nockchain (sibling)
        uses: actions/checkout@v4
        with:
          repository: nockchain/nockchain
          ref: ${{ env.NOCK_PIN }}
          path: nockchain
      - name: Checkout vesl-wallet (sibling)
        uses: actions/checkout@v4
        with:
          repository: zkvesl/vesl-wallet
          ref: ${{ env.VESL_WALLET_PIN }}
          path: vesl-wallet
      - name: Install protoc
        # nockchain's nockapp-grpc-proto crate needs the protobuf compiler
        # at build-time; the runner image doesn't ship it.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vesl-core
      # ⛔ `vesl-parity-corpus` IS NAMED HERE ON PURPOSE. It carries the
      # Hoon/Rust parity pin — the frozen answer sheet holding the digests the
      # chain's own kernel computes, checked by recomputing them in pure Rust.
      # It is a workspace member vesl-core does not depend on, so a bare
      # `-p vesl-core` would never build or run it: a target nothing names does
      # not exist. ⚑ Named explicitly rather than `--workspace`, which would
      # newly drag the four `kernels/*` members into CI for the first time.
      - name: Run tests (vesl-core)
        run: cargo test -p vesl-core -p vesl-parity-corpus
        working-directory: vesl-core

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vesl-core
        uses: actions/checkout@v4
        with:
          path: vesl-core
      - name: Checkout nockchain (sibling)
        uses: actions/checkout@v4
        with:
          repository: nockchain/nockchain
          ref: ${{ env.NOCK_PIN }}
          path: nockchain
      - name: Checkout vesl-wallet (sibling)
        uses: actions/checkout@v4
        with:
          repository: zkvesl/vesl-wallet
          ref: ${{ env.VESL_WALLET_PIN }}
          path: vesl-wallet
      - name: Install protoc
        # nockchain's nockapp-grpc-proto crate needs the protobuf compiler
        # at build-time; the runner image doesn't ship it.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit dependencies (vesl-core)
        run: cargo audit
        working-directory: vesl-core

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vesl-core
        uses: actions/checkout@v4
        with:
          path: vesl-core
      - name: Checkout nockchain (sibling)
        uses: actions/checkout@v4
        with:
          repository: nockchain/nockchain
          ref: ${{ env.NOCK_PIN }}
          path: nockchain
      - name: Checkout vesl-wallet (sibling)
        uses: actions/checkout@v4
        with:
          repository: zkvesl/vesl-wallet
          ref: ${{ env.VESL_WALLET_PIN }}
          path: vesl-wallet
      - name: Install protoc
        # nockchain's nockapp-grpc-proto crate needs the protobuf compiler
        # at build-time; the runner image doesn't ship it.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vesl-core
      - name: Clippy (vesl-core)
        run: cargo clippy -p vesl-core -p vesl-parity-corpus -- -D warnings
        working-directory: vesl-core
